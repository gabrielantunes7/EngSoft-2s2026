name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Analisar o código (Ruff)
        run: ruff check --output-format=github .

      - name: Conferir a formatação (Ruff)
        run: ruff format --check --diff .

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Gerar artefatos de distribuição
        run: python -m build

      - name: Validar instalação a partir do wheel
        run: |
          python -m venv .verify-venv
          .verify-venv/bin/pip install --quiet dist/*.whl
          .verify-venv/bin/python -c "import votacao; print('votacao', votacao.__version__)"

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
