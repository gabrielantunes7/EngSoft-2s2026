[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "votacao"
version = "0.1.0"
description = "Sistema de votação digital com motor de regras extensível"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Gabriel de Macedo Cavassani Montagna" },
    { name = "Gabriel Mattias Antunes" },
    { name = "Lucas Gomes Bussinger da Silva" },
    { name = "Lucas Lembo de Lara" },
    { name = "Rafael Scalabrin Dosso" },
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# --strict-markers e --strict-config transformam marcador desconhecido e erro de
# configuração em falha, evitando que um teste seja silenciosamente ignorado.
addopts = "-ra --strict-markers --strict-config"
markers = [
    "regressao: verifica que um contexto já entregue continua funcionando após mudanças no motor de regras",
]

[tool.coverage.run]
source = ["votacao"]
# branch = true mede também os desvios de condicional, e não apenas as linhas
# executadas. É o que importa em um motor de regras cheio de ramificações de
# quórum, peso de voto e critério de vitória.
branch = true

[tool.coverage.report]
# Mínimo definido pela equipe: abaixo disso a verificação de cobertura falha.
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Conjunto de regras definido pela equipe. Toda violação listada aqui é
# impeditiva: falha o `ruff check` e, por consequência, o pipeline.
select = [
    "E",   # pycodestyle: erros de estilo
    "W",   # pycodestyle: avisos de estilo
    "F",   # pyflakes: imports não usados, variáveis indefinidas, f-strings vazias
    "I",   # isort: ordenação e agrupamento de imports
    "N",   # pep8-naming: nomes de classes, funções e variáveis
    "UP",  # pyupgrade: sintaxe legada que já tem equivalente em Python 3.12
    "B",   # flake8-bugbear: armadilhas comuns (ex.: argumento default mutável)
    "SIM", # flake8-simplify: condicionais e blocos redundantes
    "RUF", # regras próprias do Ruff
]

[tool.ruff.lint.per-file-ignores]
# Testes podem usar asserts e nomes longos e descritivos sem restrição.
"tests/**" = ["N802"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
